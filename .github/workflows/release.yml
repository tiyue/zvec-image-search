name: Publish YaoLens

on:
  workflow_dispatch:
    inputs:
      version:
        description: Machine SemVer from pyproject.toml (for example 0.1.0)
        required: true
        type: string
      search_quality_gate_path:
        description: Repository-relative formal validation comparison.json
        required: false
        default: ""
        type: string
      allow_uncertified_search_quality:
        description: Explicitly allow release without formal search certification
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish the stable Release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: yaolens-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      exact_tag_ref: ${{ steps.policy.outputs.exact_tag_ref }}
      license_present: ${{ steps.policy.outputs.license_present }}
      search_quality_certified: ${{ steps.policy.outputs.search_quality_certified }}
      search_quality_gate_path: ${{ steps.policy.outputs.search_quality_gate_path }}
      public_version: ${{ steps.policy.outputs.public_version }}
      version_prerelease: ${{ steps.policy.outputs.version_prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate version, tag, license, and search-quality policy
        id: policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SEARCH_QUALITY_GATE_PATH: ${{ inputs.search_quality_gate_path }}
          ALLOW_UNCERTIFIED_SEARCH_QUALITY: ${{ inputs.allow_uncertified_search_quality }}
        run: |
          set -euo pipefail
          python scripts/prepare_python_release.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" \
            --prerelease false \
            --search-quality-gate-path "$SEARCH_QUALITY_GATE_PATH" \
            --allow-uncertified-search-quality "$ALLOW_UNCERTIFIED_SEARCH_QUALITY" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  quality-gates:
    name: Full test and build gates
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    name: Build and verify Windows x64
    needs:
      - prepare
      - quality-gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-packaging.txt
            requirements-webview-preview-lock.txt
      - name: Install the locked WebView packaging closure
        shell: cmd
        run: python -m pip install --requirement requirements-webview-preview-lock.txt
      - name: Locate 7-Zip
        id: sevenzip
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          seven_zip = shutil.which("7z.exe") or shutil.which("7z")
          if seven_zip is None:
              raise SystemExit("7-Zip is required to verify the NSIS installer")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"path={Path(seven_zip).resolve()}\n")
      - name: Provision pinned NSIS with Python
        id: webview_nsis
        shell: cmd
        run: >-
          python scripts\provision_nsis.py
          --output-directory "%RUNNER_TEMP%\zvec-webview-nsis-3.12"
          --github-output "%GITHUB_OUTPUT%"
      - name: Build tested WebView payload, ZIP, and NSIS installer
        shell: cmd
        run: >-
          python scripts\build_webview_preview.py
          --output-root "%RUNNER_TEMP%\yaolens-windows"
          --makensis "${{ steps.webview_nsis.outputs.makensis_path }}"
          --use-existing-frontend
      - name: Verify Windows release inventory and write checksums
        shell: cmd
        env:
          PUBLIC_VERSION: ${{ needs.prepare.outputs.public_version }}
          PACKAGE_ROOT: ${{ runner.temp }}\yaolens-windows
        run: >-
          python scripts\verify_webview_preview_release.py
          --payload "%PACKAGE_ROOT%\YaoLens"
          --portable "%PACKAGE_ROOT%\YaoLens-%PUBLIC_VERSION%-win-x64-portable.zip"
          --installer "%PACKAGE_ROOT%\YaoLens-%PUBLIC_VERSION%-win-x64-setup.exe"
          --seven-zip "${{ steps.sevenzip.outputs.path }}"
          --output-json "%PACKAGE_ROOT%\WINDOWS-RELEASE-VERIFICATION.json"
          --output-checksums "%PACKAGE_ROOT%\SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yaolens-windows-${{ inputs.version }}
          path: |
            ${{ runner.temp }}\yaolens-windows\*
            !${{ runner.temp }}\yaolens-windows\YaoLens\**
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build and verify Android
    needs:
      - prepare
      - quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Test, lint, and assemble Android APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Stage Android release asset
        shell: bash
        env:
          PUBLIC_VERSION: ${{ needs.prepare.outputs.public_version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/yaolens-android"
          apk_name="YaoLens-${PUBLIC_VERSION}-android.apk"
          mkdir -p "$output"
          cp -- android/app/build/outputs/apk/debug/app-debug.apk "$output/$apk_name"
          (
            cd "$output"
            sha256sum -- "$apk_name" > SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yaolens-android-${{ inputs.version }}
          path: ${{ runner.temp }}/yaolens-android/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release candidate
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.android.result == 'success'
    needs:
      - prepare
      - windows
      - android
    runs-on: ubuntu-latest
    outputs:
      release_title: ${{ steps.policy.outputs.release_title }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yaolens-windows-${{ inputs.version }}
          path: candidate/webview
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yaolens-android-${{ inputs.version }}
          path: candidate/android
      - name: Validate policy and flatten release assets
        id: policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERSION_PRERELEASE: ${{ needs.prepare.outputs.version_prerelease }}
          EXACT_TAG_REF: ${{ needs.prepare.outputs.exact_tag_ref }}
          LICENSE_PRESENT: ${{ needs.prepare.outputs.license_present }}
          SEARCH_QUALITY_CERTIFIED: ${{ needs.prepare.outputs.search_quality_certified }}
        run: |
          set -euo pipefail
          python scripts/assemble_python_release.py \
            --webview-directory candidate/webview \
            --android-directory candidate/android \
            --output-directory candidate/assembled \
            --version "$RELEASE_VERSION" \
            --revision "$GITHUB_SHA" \
            --version-prerelease "$VERSION_PRERELEASE" \
            --exact-tag-ref "$EXACT_TAG_REF" \
            --license-present "$LICENSE_PRESENT" \
            --search-quality-certified "$SEARCH_QUALITY_CERTIFIED" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yaolens-release-${{ inputs.version }}
          path: candidate/assembled
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish stable GitHub Release
    if: inputs.publish_release
    needs:
      - prepare
      - assemble
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yaolens-release-${{ inputs.version }}
          path: candidate
      - name: Publish release from the existing stable version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ needs.assemble.outputs.release_title }}
          VERSION_PRERELEASE: ${{ needs.prepare.outputs.version_prerelease }}
          EXACT_TAG_REF: ${{ needs.prepare.outputs.exact_tag_ref }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if [[ "$EXACT_TAG_REF" != "true" || "$GITHUB_REF" != "refs/tags/${tag}" ]]; then
            echo "Stable Releases require workflow dispatch from exact ${tag}." >&2
            exit 1
          fi
          if [[ "$VERSION_PRERELEASE" != "false" ]]; then
            echo "A stable Release requires a stable SemVer tag." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A Release already exists for ${tag}; refusing to overwrite it." >&2
            exit 1
          fi
          pushd candidate/release-assets >/dev/null
          sha256sum --check --strict RELEASE-ASSETS-SHA256SUMS.txt
          mapfile -d '' assets < <(find . -maxdepth 1 -type f -print0 | sort -z)
          popd >/dev/null
          for index in "${!assets[@]}"; do
            assets[index]="candidate/release-assets/${assets[index]#./}"
          done
          arguments=(
            release create "$tag"
            --verify-tag
            --title "$RELEASE_TITLE"
            --notes-file candidate/RELEASE-NOTES.md
          )
          gh "${arguments[@]}" "${assets[@]}"
