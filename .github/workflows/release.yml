name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from pyproject.toml (for example 0.4.0 or 0.5.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Must exactly match whether version has a prerelease suffix
        required: true
        default: false
        type: boolean
      search_quality_gate_path:
        description: Repository-relative formal validation comparison.json
        required: false
        default: ""
        type: string
      allow_uncertified_search_quality_preview:
        description: Explicitly build a Preview without formal search certification
        required: true
        default: false
        type: boolean
      require_authenticode:
        description: Fail unless an exact version tag can use signing secrets
        required: true
        default: false
        type: boolean
      create_draft_release:
        description: Create an approved draft Release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      exact_tag_ref: ${{ steps.policy.outputs.exact_tag_ref }}
      license_present: ${{ steps.policy.outputs.license_present }}
      search_quality_certified: ${{ steps.policy.outputs.search_quality_certified }}
      search_quality_gate_path: ${{ steps.policy.outputs.search_quality_gate_path }}
      version_prerelease: ${{ steps.policy.outputs.version_prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate version, tag, license, and search-quality policy
        id: policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
          SEARCH_QUALITY_GATE_PATH: ${{ inputs.search_quality_gate_path }}
          ALLOW_UNCERTIFIED_PREVIEW: ${{ inputs.allow_uncertified_search_quality_preview }}
          REQUIRE_AUTHENTICODE: ${{ inputs.require_authenticode }}
        run: |
          set -euo pipefail
          python scripts/prepare_python_release.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" \
            --prerelease "$REQUESTED_PRERELEASE" \
            --search-quality-gate-path "$SEARCH_QUALITY_GATE_PATH" \
            --allow-uncertified-preview "$ALLOW_UNCERTIFIED_PREVIEW" \
            --require-authenticode "$REQUIRE_AUTHENTICODE" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  quality-gates:
    name: Full test and build gates
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  desktop-unsigned:
    name: Build unsigned pure-Python desktop
    needs:
      - prepare
      - quality-gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python packaging closure
        shell: cmd
        run: python -m pip install --requirement requirements-packaging.txt
      - name: Provision pinned NSIS with Python
        id: nsis
        shell: cmd
        run: >-
          python scripts\provision_nsis.py
          --output-directory "%RUNNER_TEMP%\zvec-nsis-3.12"
          --github-output "%GITHUB_OUTPUT%"
      - name: Build and verify unsigned win-x64 artifacts
        shell: cmd
        run: >-
          python scripts\build_python_desktop.py
          --output-root "%RUNNER_TEMP%\zvec-desktop-unsigned"
          --makensis "${{ steps.nsis.outputs.makensis_path }}"
          --signing-status unsigned
      - name: Generate uncertified release materials
        if: needs.prepare.outputs.search_quality_certified != 'true'
        shell: cmd
        run: >-
          python scripts\generate_python_release_materials.py
          --repository-root "%GITHUB_WORKSPACE%"
          --output-root "%RUNNER_TEMP%\zvec-desktop-unsigned"
          --expected-revision "%GITHUB_SHA%"
          --signing-status unsigned
      - name: Generate certified release materials
        if: needs.prepare.outputs.search_quality_certified == 'true'
        shell: cmd
        env:
          QUALITY_REPORT: ${{ needs.prepare.outputs.search_quality_gate_path }}
        run: >-
          python scripts\generate_python_release_materials.py
          --repository-root "%GITHUB_WORKSPACE%"
          --output-root "%RUNNER_TEMP%\zvec-desktop-unsigned"
          --expected-revision "%GITHUB_SHA%"
          --signing-status unsigned
          --search-quality-report "%GITHUB_WORKSPACE%\%QUALITY_REPORT%"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-python-${{ inputs.version }}-unsigned
          path: |
            ${{ runner.temp }}\zvec-desktop-unsigned\*
            !${{ runner.temp }}\zvec-desktop-unsigned\Zvec-Desktop\**
          if-no-files-found: error
          retention-days: 30

  webview-preview:
    name: Build and verify unsigned WebView Preview
    needs:
      - prepare
      - quality-gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-packaging.txt
            requirements-webview-preview-lock.txt
      - name: Install the locked WebView packaging closure
        shell: cmd
        run: python -m pip install --requirement requirements-webview-preview-lock.txt
      - name: Locate 7-Zip
        id: sevenzip
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          seven_zip = shutil.which("7z.exe") or shutil.which("7z")
          if seven_zip is None:
              raise SystemExit("7-Zip is required to verify the NSIS installer")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"path={Path(seven_zip).resolve()}\n")
      - name: Provision pinned NSIS with Python
        id: webview_nsis
        shell: cmd
        run: >-
          python scripts\provision_nsis.py
          --output-directory "%RUNNER_TEMP%\zvec-webview-nsis-3.12"
          --github-output "%GITHUB_OUTPUT%"
      - name: Build tested WebView payload, ZIP, and NSIS installer
        shell: cmd
        run: >-
          python scripts\build_webview_preview.py
          --output-root "%RUNNER_TEMP%\zvec-webview-preview"
          --makensis "${{ steps.webview_nsis.outputs.makensis_path }}"
          --use-existing-frontend
      - name: Verify WebView release inventory and write checksums
        shell: cmd
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
          PREVIEW_ROOT: ${{ runner.temp }}\zvec-webview-preview
        run: >-
          python scripts\verify_webview_preview_release.py
          --payload "%PREVIEW_ROOT%\Zvec-Webview-Preview"
          --portable "%PREVIEW_ROOT%\Zvec-Webview-Preview-%PREVIEW_VERSION%-win-x64-portable.zip"
          --installer "%PREVIEW_ROOT%\Zvec-Webview-Preview-%PREVIEW_VERSION%-win-x64-unsigned-setup.exe"
          --seven-zip "${{ steps.sevenzip.outputs.path }}"
          --output-json "%PREVIEW_ROOT%\webview-preview-release-verification.json"
          --output-checksums "%PREVIEW_ROOT%\SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webview-preview-${{ inputs.version }}-unsigned
          path: |
            ${{ runner.temp }}\zvec-webview-preview\*
            !${{ runner.temp }}\zvec-webview-preview\Zvec-Webview-Preview\**
          if-no-files-found: error
          retention-days: 30

  desktop-signing:
    name: Select or build protected Python desktop candidate
    if: needs.prepare.outputs.exact_tag_ref == 'true'
    needs:
      - prepare
      - quality-gates
      - desktop-unsigned
    runs-on: windows-latest
    environment: authenticode-signing
    outputs:
      artifact_name: ${{ steps.signing.outputs.artifact_name }}
      signing_status: ${{ steps.signing.outputs.status }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Resolve protected Authenticode policy
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.ZVEC_AUTHENTICODE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.ZVEC_AUTHENTICODE_PFX_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          REQUIRE_AUTHENTICODE: ${{ inputs.require_authenticode }}
        run: |
          set -euo pipefail
          has_certificate=false
          has_password=false
          [[ -n "$CERTIFICATE_BASE64" ]] && has_certificate=true
          [[ -n "$CERTIFICATE_PASSWORD" ]] && has_password=true
          if [[ "$has_certificate" != "$has_password" ]]; then
            echo "Authenticode secrets are incomplete." >&2
            exit 1
          fi
          if [[ "$REQUIRE_AUTHENTICODE" == "true" && "$has_certificate" != "true" ]]; then
            echo "Authenticode was required, but protected secrets are absent." >&2
            exit 1
          fi
          if [[ "$has_certificate" == "true" ]]; then
            status=authenticode
          else
            status=unsigned
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "artifact_name=desktop-python-${RELEASE_VERSION}-${status}" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.signing.outputs.status == 'authenticode'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python packaging closure
        if: steps.signing.outputs.status == 'authenticode'
        shell: cmd
        run: python -m pip install --requirement requirements-packaging.txt
      - name: Provision pinned NSIS with Python
        id: nsis
        if: steps.signing.outputs.status == 'authenticode'
        shell: cmd
        run: >-
          python scripts\provision_nsis.py
          --output-directory "%RUNNER_TEMP%\zvec-nsis-3.12"
          --github-output "%GITHUB_OUTPUT%"
      - name: Build, sign, and verify win-x64 artifacts
        if: steps.signing.outputs.status == 'authenticode'
        shell: cmd
        env:
          ZVEC_AUTHENTICODE_PFX_BASE64: ${{ secrets.ZVEC_AUTHENTICODE_PFX_BASE64 }}
          ZVEC_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.ZVEC_AUTHENTICODE_PFX_PASSWORD }}
        run: >-
          python scripts\build_python_desktop.py
          --output-root "%RUNNER_TEMP%\zvec-desktop-authenticode"
          --makensis "${{ steps.nsis.outputs.makensis_path }}"
          --signing-status authenticode
      - name: Smoke signed portable, install, backend health, and uninstall
        if: steps.signing.outputs.status == 'authenticode'
        shell: cmd
        run: >-
          python scripts\smoke_python_desktop_installer.py
          --output-root "%RUNNER_TEMP%\zvec-desktop-authenticode"
      - name: Generate uncertified signed release materials
        if: >-
          steps.signing.outputs.status == 'authenticode' &&
          needs.prepare.outputs.search_quality_certified != 'true'
        shell: cmd
        run: >-
          python scripts\generate_python_release_materials.py
          --repository-root "%GITHUB_WORKSPACE%"
          --output-root "%RUNNER_TEMP%\zvec-desktop-authenticode"
          --expected-revision "%GITHUB_SHA%"
          --signing-status authenticode
      - name: Generate certified signed release materials
        if: >-
          steps.signing.outputs.status == 'authenticode' &&
          needs.prepare.outputs.search_quality_certified == 'true'
        shell: cmd
        env:
          QUALITY_REPORT: ${{ needs.prepare.outputs.search_quality_gate_path }}
        run: >-
          python scripts\generate_python_release_materials.py
          --repository-root "%GITHUB_WORKSPACE%"
          --output-root "%RUNNER_TEMP%\zvec-desktop-authenticode"
          --expected-revision "%GITHUB_SHA%"
          --signing-status authenticode
          --search-quality-report "%GITHUB_WORKSPACE%\%QUALITY_REPORT%"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.signing.outputs.status == 'authenticode'
        with:
          name: desktop-python-${{ inputs.version }}-authenticode
          path: |
            ${{ runner.temp }}\zvec-desktop-authenticode\*
            !${{ runner.temp }}\zvec-desktop-authenticode\Zvec-Desktop\**
          if-no-files-found: error
          retention-days: 30

  desktop-selection:
    name: Select desktop artifact without exposing secrets
    if: >-
      always() &&
      needs.desktop-unsigned.result == 'success' &&
      (
        (needs.prepare.outputs.exact_tag_ref == 'true' &&
         needs.desktop-signing.result == 'success') ||
        (needs.prepare.outputs.exact_tag_ref != 'true' &&
         needs.desktop-signing.result == 'skipped')
      )
    needs:
      - prepare
      - desktop-unsigned
      - desktop-signing
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      signing_status: ${{ steps.select.outputs.signing_status }}
    steps:
      - name: Select protected tag result or unsigned preview
        id: select
        shell: bash
        env:
          EXACT_TAG_REF: ${{ needs.prepare.outputs.exact_tag_ref }}
          TAGGED_ARTIFACT: ${{ needs.desktop-signing.outputs.artifact_name }}
          TAGGED_STATUS: ${{ needs.desktop-signing.outputs.signing_status }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EXACT_TAG_REF" == "true" ]]; then
            artifact="$TAGGED_ARTIFACT"
            status="$TAGGED_STATUS"
          else
            artifact="desktop-python-${RELEASE_VERSION}-unsigned"
            status=unsigned
          fi
          if [[ -z "$artifact" || ! "$status" =~ ^(unsigned|authenticode)$ ]]; then
            echo "Desktop candidate selection produced invalid outputs." >&2
            exit 1
          fi
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"
          echo "signing_status=$status" >> "$GITHUB_OUTPUT"

  native-package:
    name: Build and verify native Python wheel
    needs:
      - prepare
      - quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build tested Vite resources for the wheel
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global npm@11.13.0
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build, install, and smoke test wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/zvec-native-package"
          venv="$RUNNER_TEMP/zvec-native-release-venv"
          mkdir -p "$output"
          python -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$output" .
          mapfile -t wheels < <(find "$output" -maxdepth 1 -type f -name '*.whl')
          [[ "${#wheels[@]}" == 1 ]]
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check \
            --constraint requirements-lock.txt "${wheels[0]}"
          "$venv/bin/zvec" help | grep -F "Docker is not required"
          cp requirements-lock.txt "$output/requirements-lock.txt"
          checksum="$RUNNER_TEMP/zvec-native-SHA256SUMS.txt"
          (
            cd "$output"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$checksum"
          mv "$checksum" "$output/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ inputs.version }}-wheel
          path: ${{ runner.temp }}/zvec-native-package/*
          if-no-files-found: error
          retention-days: 30

  android-preview:
    name: Build Android LAN Viewer debug preview
    needs:
      - prepare
      - quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Test, lint, and assemble debug preview
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Stage explicitly debug-signed preview
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/zvec-android-preview"
          apk_name="Zvec-LAN-Viewer-${RELEASE_VERSION}-android-debug-preview.apk"
          mkdir -p "$output"
          cp -- android/app/build/outputs/apk/debug/app-debug.apk "$output/$apk_name"
          (
            cd "$output"
            sha256sum -- "$apk_name" > SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lan-viewer-${{ inputs.version }}-debug-preview
          path: ${{ runner.temp }}/zvec-android-preview/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release candidate
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.desktop-selection.result == 'success' &&
      needs.webview-preview.result == 'success' &&
      needs.native-package.result == 'success' &&
      needs.android-preview.result == 'success'
    needs:
      - prepare
      - desktop-selection
      - webview-preview
      - native-package
      - android-preview
    runs-on: ubuntu-latest
    outputs:
      effective_prerelease: ${{ steps.policy.outputs.effective_prerelease }}
      release_title: ${{ steps.policy.outputs.release_title }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.desktop-selection.outputs.artifact_name }}
          path: candidate/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webview-preview-${{ inputs.version }}-unsigned
          path: candidate/webview
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-${{ inputs.version }}-wheel
          path: candidate/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-lan-viewer-${{ inputs.version }}-debug-preview
          path: candidate/android
      - name: Apply stable-channel policy and flatten release assets
        id: policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_STATUS: ${{ needs.desktop-selection.outputs.signing_status }}
          VERSION_PRERELEASE: ${{ needs.prepare.outputs.version_prerelease }}
          EXACT_TAG_REF: ${{ needs.prepare.outputs.exact_tag_ref }}
          LICENSE_PRESENT: ${{ needs.prepare.outputs.license_present }}
          SEARCH_QUALITY_CERTIFIED: ${{ needs.prepare.outputs.search_quality_certified }}
        run: |
          set -euo pipefail
          python scripts/assemble_python_release.py \
            --desktop-directory candidate/desktop \
            --webview-directory candidate/webview \
            --native-directory candidate/native \
            --android-directory candidate/android \
            --output-directory candidate/assembled \
            --version "$RELEASE_VERSION" \
            --revision "$GITHUB_SHA" \
            --signing-status "$SIGNING_STATUS" \
            --version-prerelease "$VERSION_PRERELEASE" \
            --exact-tag-ref "$EXACT_TAG_REF" \
            --license-present "$LICENSE_PRESENT" \
            --search-quality-certified "$SEARCH_QUALITY_CERTIFIED" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: candidate/assembled
          if-no-files-found: error
          retention-days: 30

  create-draft-release:
    name: Create approved draft GitHub Release
    if: inputs.create_draft_release
    needs:
      - prepare
      - assemble
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: candidate
      - name: Create draft release from the existing version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ needs.assemble.outputs.release_title }}
          EFFECTIVE_PRERELEASE: ${{ needs.assemble.outputs.effective_prerelease }}
          VERSION_PRERELEASE: ${{ needs.prepare.outputs.version_prerelease }}
          EXACT_TAG_REF: ${{ needs.prepare.outputs.exact_tag_ref }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if [[ "$EXACT_TAG_REF" != "true" || "$GITHUB_REF" != "refs/tags/${tag}" ]]; then
            echo "Draft Releases require workflow dispatch from exact ${tag}." >&2
            exit 1
          fi
          if [[ "$VERSION_PRERELEASE" == "false" && "$EFFECTIVE_PRERELEASE" == "true" ]]; then
            echo "A stable SemVer tag cannot be consumed by a preview Release." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A Release already exists for ${tag}; refusing to overwrite it." >&2
            exit 1
          fi
          pushd candidate/release-assets >/dev/null
          sha256sum --check --strict RELEASE-ASSETS-SHA256SUMS.txt
          mapfile -d '' assets < <(find . -maxdepth 1 -type f -print0 | sort -z)
          popd >/dev/null
          for index in "${!assets[@]}"; do
            assets[index]="candidate/release-assets/${assets[index]#./}"
          done
          arguments=(
            release create "$tag"
            --verify-tag
            --draft
            --title "$RELEASE_TITLE"
            --notes-file candidate/RELEASE-NOTES.md
          )
          if [[ "$EFFECTIVE_PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}" "${assets[@]}"
