name: Large-library nightly gates

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-library-nightly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  million-row-gates:
    name: Curated million-row gates (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DASHSCOPE_API_KEY: ""
      PYTHONUTF8: "1"
      ZVEC_RUN_MILLION_SCAN_STAGING_TEST: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact native runtime closure
        shell: cmd
        run: >-
          python -m pip install
          --constraint requirements-lock.txt
          --editable .
      - name: Run curated 100k and million-row gates
        shell: cmd
        run: >-
          python scripts\run_large_library_gates.py
          --profile nightly
          --million
          --json-report "%RUNNER_TEMP%\large-library-nightly.json"
      - name: Upload structured gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: large-library-nightly-${{ github.sha }}-win-x64
          path: ${{ runner.temp }}\large-library-nightly.json
          if-no-files-found: warn
          retention-days: 30
