name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy image_vector_service image_service.py zvec_logging.py
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Windows launcher tests
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_launcher.ps1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zvec-image-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Docker end-to-end smoke test
        run: python tests/docker_smoke.py zvec-image-search:ci --max-size-mib 100
