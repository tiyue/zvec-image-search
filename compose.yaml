services:
  workspace-init:
    image: zvec-image-search:local
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown 10001:10001 /data/workspace
    network_mode: none
    read_only: true
    volumes:
      - type: volume
        source: workspace
        target: /data/workspace
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zvec-image-search:local
    init: true
    read_only: true
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_API_URL: ${DASHSCOPE_API_URL:-}
      ZVEC_IMAGE_WORKSPACE: /data/workspace
      ZVEC_IMAGE_RESULTS_DIR: /data/results
    volumes:
      - type: bind
        source: ${ZVEC_IMAGES_DIR:-./images}
        target: /data/roots/main
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: workspace
        target: /data/workspace
      - type: bind
        source: ${ZVEC_RESULTS_DIR:-./docker-data/search_results}
        target: /data/results
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --help

volumes:
  workspace:
    name: ${ZVEC_WORKSPACE_VOLUME:-zvec-image-workspace}
